<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neuro Vision</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>Neuro Vision</h1>
    <p class="sub">Visao computacional local — a webcam enxerga e registra o que ve.</p>
  </header>

  <main>
    <section class="viewer">
      <div class="stage">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="overlay"></canvas>
        <div id="placeholder">Clique em iniciar para ligar a webcam</div>
      </div>
      <div class="controls">
        <button id="start" type="button">Iniciar</button>
        <button id="stop" type="button" disabled>Parar</button>
        <label>
          Motor
          <select id="motor">
            <option value="deteccao">Detecção (transformers.js)</option>
            <option value="ollama">Descrição (Ollama qwen3-vl)</option>
          </select>
        </label>
        <label>
          Modelo
          <select id="model">
            <option value="Xenova/yolos-tiny">YOLOS tiny (rapido)</option>
            <option value="Xenova/detr-resnet-50">DETR ResNet-50 (preciso)</option>
          </select>
        </label>
        <label>
          Intervalo
          <input id="interval" type="range" min="1" max="15" step="1" value="4" />
          <span id="intervalValue">4s</span>
        </label>
        <label>
          Confianca minima
          <input id="threshold" type="range" min="0.1" max="0.9" step="0.05" value="0.5" />
          <span id="thresholdValue">0.50</span>
        </label>
      </div>
      <div id="status" class="status">Pronto.</div>
    </section>

    <aside class="logpanel">
      <div class="logpanel-head">
        <h2>Registro do que viu <span id="logCount" class="count">0</span></h2>
        <button id="clearLog" class="ghost" type="button" disabled>Limpar</button>
      </div>
      <ul id="log"></ul>
    </aside>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
