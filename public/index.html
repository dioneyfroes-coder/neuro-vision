<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neuro Vision</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>Neuro Vision</h1>
    <p class="sub">Visao computacional local — a webcam enxerga e registra o que ve.</p>
    <span id="modeloStatus" class="health" title="Status do backend de visao">Modelo: verificando...</span>
    <span id="diagInfo" class="diag" title="Diagnostico da sessao">Diagnostico: —</span>
    <span id="persistAviso" class="aviso persist-aviso" role="status" hidden></span>
  </header>

  <main>
    <section class="viewer">
      <div class="stage">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="overlay"></canvas>
        <div id="spinner" class="spinner" hidden aria-hidden="true"></div>
        <div id="placeholder">Clique em iniciar para ligar a webcam</div>
      </div>
      <div class="controls">
        <button id="start" type="button">Iniciar</button>
        <button id="stop" type="button" disabled>Parar</button>
        <label>
          Motor
          <select id="motor">
            <option value="percepcao">Percepção multi-frame (4 frames + detecção local)</option>
            <option value="roteiro">Roteiro (modelo de visão)</option>
            <option value="deteccao">Detecção (transformers.js)</option>
            <option value="visao">Descrição (modelo de visão)</option>
            <option value="eventos">Eventos (leve + modelo de visão sob demanda)</option>
          </select>
        </label>
        <button id="analisarAgora" type="button" disabled>Analisar agora</button>
        <label>
          Modelo
          <select id="model">
            <option value="onnx-community/yolov10n">YOLOv10 nano (ONNX, rapido)</option>
            <option value="onnx-community/yolov10s">YOLOv10 small (ONNX, preciso)</option>
          </select>
        </label>
        <label>
          Modelo de visão
          <select id="modeloVisao" title="Modelo do backend de visão (LM Studio). Lista os modelos instalados.">
            <option value="">Padrão do servidor</option>
          </select>
        </label>
        <label>
          Intervalo
          <input id="interval" type="range" min="1" max="15" step="1" value="4" />
          <span id="intervalValue">4s</span>
        </label>
        <label>
          Confianca minima
          <input id="threshold" type="range" min="0.1" max="0.9" step="0.05" value="0.5" />
          <span id="thresholdValue">0.50</span>
        </label>
        <label
          title="Experimental: marca regioes sensiveis (NSFW) em cada frame. Exige pesos ONNX exportados em modelos/yolonsfw/ (scripts/exportar-yolo-nsfw.mjs). As marcacoes entram no contexto do modelo de visao somente com o toggle ligado."
        >
          <input id="nsfw" type="checkbox" />
          NSFW (experimental)
        </label>
      </div>
      <div id="status" class="status">Pronto.</div>
    </section>

    <aside class="logpanel">
      <div class="logpanel-head">
        <h2>Registro do que viu <span id="logCount" class="count">0</span></h2>
        <div class="logpanel-actions">
          <button id="exportLog" class="ghost" type="button" disabled>Exportar</button>
          <button id="exportPendentes" class="ghost" type="button" disabled title="Exportar gravacoes que nao chegaram ao servidor">Pendentes</button>
          <button id="clearLog" class="ghost" type="button" disabled>Limpar</button>
        </div>
      </div>
      <input id="filter" class="filter" type="search" placeholder="Filtrar por texto, objeto ou modelo..." />
      <ul id="log"></ul>
    </aside>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
